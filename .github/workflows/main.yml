
name: Windows Tailscale Remote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tailscale-remote
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Remote Desktop
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Install Tailscale
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process $installer `
            -ArgumentList "/quiet" -Wait

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "Tailscale installation failed"
          }

          $service = Get-Service Tailscale -ErrorAction Stop
          if ($service.Status -ne "Running") {
            Start-Service Tailscale
          }

          Write-Host "Tailscale installed successfully"

      - name: Generate Windows credentials
        id: credentials
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RemoteUser"

          $bytes = New-Object byte[] 24
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()

          $random = [Convert]::ToBase64String($bytes).
            TrimEnd('=').
            Replace('+','A').
            Replace('/','B')

          $password = "Aa1!" + $random

          $secure = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $username -Password $secure
          } else {
            New-LocalUser -Name $username `
              -Password $secure `
              -PasswordNeverExpires `
              -Description "Private remote desktop account"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          "username=$username" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

          Write-Host "Windows account created successfully"

      - name: Configure Remote Desktop
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "Remote Desktop configured"

      - name: Connect Tailscale
        shell: powershell
        timeout-minutes: 5
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TS_AUTHKEY GitHub secret"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=windows-remote-${{ github.run_id }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

          $connected = $false

          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5

            $ip = & $ts ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $ip) {
              $ip = ($ip | Select-Object -First 1).Trim()

              if ($ip -match '^100\.') {
                $connected = $true
                break
              }
            }
          }

          if (!$connected) {
            throw "Could not obtain Tailscale IP"
          }

          "ip=$ip" >> $env:GITHUB_OUTPUT

          Write-Host "Tailscale connected successfully"

      - name: Publish connection information
        if: success()
        shell: powershell
        env:
          IP: ${{ steps.Connect-Tailscale.outputs.ip }}
          USERNAME: ${{ steps.credentials.outputs.username }}
          PASSWORD: ${{ steps.credentials.outputs.password }}
        run: |
          @"
          # Windows Remote Desktop

          Status: Connected

          **IP Tailscale:** $env:IP

          **Username:** $env:USERNAME

          **Password:** $env:PASSWORD

          **RDP Port:** 3389

          **Connection:** Tailscale private network

          **Run ID:** $env:GITHUB_RUN_ID

          Use Microsoft Remote Desktop to connect.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "Connection information published"
