
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1 -Force

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Profile Any

      - name: Create RDP User with Random Password
        shell: pwsh
        run: |
          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $numbers = [char[]](48..57)
          $special = [char[]](33..38)

          $passwordChars = @()
          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "Skyro" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "Skyro" -Password $securePass
          } else {
            New-LocalUser -Name "Skyro" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "Skyro" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro" -ErrorAction SilentlyContinue

          "RDP_USER=Skyro" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          Start-Service -Name Tailscale

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TAILSCALE_AUTH_KEY secret"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
            $result = & $ts ip -4

            if ($result) {
              $tsIP = ($result | Select-Object -First 1).Trim()
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale IP not assigned"
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP service..."

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
            Start-Service TermService
          }

          $ready = $false

          for ($i = 0; $i -lt 20; $i++) {
            if (Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 3389 `
              -InformationLevel Quiet) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "RDP port 3389 is not responding"
          }

          Write-Host "RDP service is ready!"

      - name: Display RDP Credentials
        shell: pwsh
        run: |
          $summary = @"
          # RDP ACCESS

          **Address:** $env:TAILSCALE_IP

          **Username:** $env:RDP_USER

          **Password:** $env:RDP_PASSWORD

          **Port:** 3389

          **Connection:** Tailscale

          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          Write-Host "RDP credentials saved in workflow summary."

      - name: Maintain Connection and Recover Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "================================"
          Write-Host "RDP ACTIVE"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USER: $env:RDP_USER"
          Write-Host "================================"

          while ($true) {

            $service = Get-Service Tailscale -ErrorAction SilentlyContinue

            if (-not $service -or $service.Status -ne "Running") {
              Write-Host "Restarting Tailscale service..."

              Start-Service Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 10
            }

            & $ts status *> $null

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Recovering Tailscale connection..."

              & $ts up `
                --authkey="$env:TS_AUTHKEY" `
                --hostname="gh-runner-$env:GITHUB_RUN_ID"
            }

            if ((Get-Service TermService).Status -ne "Running") {
              Start-Service TermService
            }

            Write-Host "[$(Get-Date)] RDP and Tailscale checked."

            Start-Sleep -Seconds 60
          }
