
name: RDP - Windows Tailscale Android PRO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    name: Configure Windows Remote Desktop
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check Windows and permissions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)

          if (!$principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "Runner must run with administrator privileges"
          }

          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Windows: $($os.Caption)"

          if ($os.Caption -match "Home") {
            throw "Windows Home cannot host Microsoft RDP"
          }

      - name: Verify Tailscale
        id: tailscale
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "Install Tailscale on this Windows computer first"
          }

          $service = Get-Service Tailscale

          if ($service.Status -ne "Running") {
            Start-Service Tailscale
          }

          $ip = & $ts ip -4

          if ($LASTEXITCODE -ne 0 -or !$ip) {
            throw "Tailscale is not connected"
          }

          $ip = ($ip | Select-Object -First 1).Trim()

          if ($ip -notmatch '^100\.') {
            throw "Invalid Tailscale IPv4 address"
          }

          "ip=$ip" >> $env:GITHUB_OUTPUT

          Write-Host "Tailscale connection verified"

      - name: Generate Windows account
        id: credentials
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RemoteUser"

          $bytes = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()

          $random = [Convert]::ToBase64String($bytes).
            TrimEnd('=').
            Replace('+','A').
            Replace('/','B')

          $password = "Aa1!" + $random

          $secure = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $username `
              -Password $secure `
              -PasswordNeverExpires $true
          } else {
            New-LocalUser -Name $username `
              -Password $secure `
              -PasswordNeverExpires `
              -Description "Private Tailscale RDP account"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          "username=$username" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

          Write-Host "::add-mask::$password"
          Write-Host "Windows credentials generated"

      - name: Configure secure RDP
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          $path = "HKLM:\System\CurrentControlSet\Control\Terminal Server"

          Set-ItemProperty -Path $path `
            -Name fDenyTSConnections -Value 0

          $rdpPath = "$path\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $rdpPath `
            -Name UserAuthentication -Value 1

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Get-NetFirewallRule `
            -DisplayName "RDP Tailscale Private" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Private" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "Secure RDP configured"

      - name: Verify RDP listener
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          $ready = $false

          for ($i = 0; $i -lt 20; $i++) {
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if (!$ready) {
            throw "RDP port 3389 is not listening"
          }

          Write-Host "RDP listener is ready"

      - name: Publish connection details
        shell: powershell
        env:
          RDP_IP: ${{ steps.tailscale.outputs.ip }}
          RDP_USER: ${{ steps.credentials.outputs.username }}
          RDP_PASS: ${{ steps.credentials.outputs.password }}
        run: |
          $summary = @"
          # WINDOWS RDP - CONNECTION INFORMATION

          Status: READY

          Tailscale IP: $env:RDP_IP

          Username: $env:RDP_USER

          Password: $env:RDP_PASS

          RDP Port: 3389

          Protocol: RDP + Tailscale

          "@

          $summary | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          Write-Host "Connection information published"
