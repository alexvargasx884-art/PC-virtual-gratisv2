name: RDP - Windows Tailscale Android PRO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp-windows-session
  cancel-in-progress: false

jobs:
  secure-rdp:
    name: Windows Remote Desktop
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # 1. Prepare Windows
      - name: Prepare Windows
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Preparing Windows runner..."

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)

          if (!$principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "Administrator permissions required"
          }

          Write-Host "Windows runner ready"

      # 2. Install Tailscale with retries
      - name: Install Tailscale
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $installer = "$env:TEMP\tailscale-installer.msi"

          if (!(Test-Path $ts)) {

            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

            $downloaded = $false

            for ($i = 1; $i -le 4; $i++) {
              try {
                Write-Host "Download attempt $i of 4"

                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $installer `
                  -TimeoutSec 120 `
                  -UseBasicParsing

                if (!(Test-Path $installer) -or
                    (Get-Item $installer).Length -lt 1000000) {
                  throw "Invalid installer"
                }

                $downloaded = $true
                break
              }
              catch {
                Write-Warning $_.Exception.Message

                Remove-Item $installer -Force `
                  -ErrorAction SilentlyContinue

                Start-Sleep -Seconds 8
              }
            }

            if (!$downloaded) {
              throw "Unable to download Tailscale"
            }

            $process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList "/i `"$installer`" /qn /norestart" `
              -Wait -PassThru

            if ($process.ExitCode -notin @(0,3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }
          }

          if (!(Test-Path $ts)) {
            throw "Tailscale executable missing"
          }

          $service = Get-Service Tailscale `
            -ErrorAction SilentlyContinue

          if (!$service) {
            throw "Tailscale service not found"
          }

          if ($service.Status -ne "Running") {
            Start-Service Tailscale
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale installed successfully"

      # 3. Generate Windows credentials
      - name: Generate Windows credentials
        id: credentials
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RemoteUser"

          $bytes = New-Object byte[] 32

          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()

          $random = [Convert]::ToBase64String($bytes).
            TrimEnd('=').
            Replace('+','A').
            Replace('/','B')

          $password = "Aa1!" + $random

          $secure = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {

            Set-LocalUser `
              -Name $username `
              -Password $secure `
              -PasswordNeverExpires $true

          } else {

            New-LocalUser `
              -Name $username `
              -Password $secure `
              -PasswordNeverExpires `
              -Description "Private Tailscale RDP account"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "::add-mask::$password"

          Write-Host "Windows credentials created"

      # 4. Configure secure RDP
      - name: Configure Remote Desktop
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $base = "HKLM:\System\CurrentControlSet\Control\Terminal Server"

          Set-ItemProperty `
            -Path $base `
            -Name "fDenyTSConnections" `
            -Value 0

          $rdp = "$base\WinStations\RDP-Tcp"

          Set-ItemProperty `
            -Path $rdp `
            -Name "UserAuthentication" `
            -Value 1

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Get-NetFirewallRule `
            -DisplayName "RDP Tailscale Private" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Private" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "Remote Desktop configured"

      # 5. Connect Tailscale
      - name: Connect Tailscale
        id: tailscale
        shell: powershell
        timeout-minutes: 5
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TS_AUTHKEY GitHub secret"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=android-rdp-${{ github.run_id }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed"
          }

          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {

            Start-Sleep -Seconds 3

            $result = & $ts ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $result) {

              $candidate = ($result | Select-Object -First 1).Trim()

              if ($candidate -match '^100\.') {
                $ip = $candidate
                break
              }
            }
          }

          if (!$ip) {
            throw "Tailscale IP was not assigned"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected successfully"

      # 6. Verify RDP
      - name: Verify RDP
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 4
          }

          if (!$ready) {
            throw "RDP port 3389 is not listening"
          }

          Write-Host "RDP listener verified"

      # 7. Publish connection information
      - name: Publish Android connection details
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $summary = @"
          # WINDOWS RDP CONNECTION

          Status: READY

          Address: $env:TAILSCALE_IP

          Username: $env:RDP_USERNAME

          Password: $env:RDP_PASSWORD

          Port: 3389

          Protocol: Tailscale + RDP

          Session: $env:GITHUB_RUN_ID

          "@

          $summary | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

          Write-Host "Connection information published"

      # 8. Maintain session
      - name: Maintain RDP session
        shell: powershell
        timeout-minutes: 330
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "RDP SESSION ACTIVE"

          while ($true) {

            $service = Get-Service TermService
            $tsService = Get-Service Tailscale

            if ($tsService.Status -ne "Running") {
              Write-Warning "Restarting Tailscale service"
              Start-Service Tailscale
            }

            if ($service.Status -ne "Running") {
              Write-Warning "Restarting RDP service"
              Start-Service TermService
            }

            Start-Sleep -Seconds 5

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            $ip = & $ts ip -4 2>$null

            if (!$listener -or !$ip) {
              Write-Warning "Connection health check failed"
            } else {
              Write-Host "[$(Get-Date)] RDP ONLINE - $ip"
            }

            Start-Sleep -Seconds 55
          }
