
name: RDP - Windows Tailscale Android PRO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rdp-session
  cancel-in-progress: false

jobs:
  secure-rdp:
    name: Windows Remote Desktop
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # 1. PREPARE WINDOWS
      - name: Prepare Windows
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)

          if (!$principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "Administrator permissions required"
          }

          Write-Host "Windows runner ready"

      # 2. INSTALL TAILSCALE
      - name: Install Tailscale
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $installer = "$env:TEMP\tailscale-setup.msi"

          if (!(Test-Path $ts)) {

            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
            $installed = $false

            for ($i = 1; $i -le 4; $i++) {
              try {
                Write-Host "Downloading Tailscale attempt $i"

                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $installer `
                  -TimeoutSec 120

                if ((Get-Item $installer).Length -lt 1000000) {
                  throw "Invalid installer"
                }

                $process = Start-Process msiexec.exe `
                  -ArgumentList "/i `"$installer`" /qn /norestart" `
                  -Wait -PassThru

                if ($process.ExitCode -notin @(0,3010)) {
                  throw "Installation failed: $($process.ExitCode)"
                }

                $installed = $true
                break
              }
              catch {
                Write-Warning $_.Exception.Message
                Remove-Item $installer -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 8
              }
            }

            if (!$installed) {
              throw "Unable to install Tailscale"
            }
          }

          if (!(Test-Path $ts)) {
            throw "Tailscale executable missing"
          }

          $service = Get-Service Tailscale

          if ($service.Status -ne "Running") {
            Start-Service Tailscale
          }

          Write-Host "Tailscale installed"

      # 3. GENERATE RANDOM USER AND PASSWORD
      - name: Generate random Windows credentials
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          function New-RandomHex($length) {
            $bytes = New-Object byte[] $length
            $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
            $rng.GetBytes($bytes)
            $rng.Dispose()

            return ([BitConverter]::ToString($bytes) -replace '-', '')
          }

          $username = "USER_" + (New-RandomHex 6)
          $password = "Aa1!" + (New-RandomHex 24)

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -PasswordNeverExpires `
            -AccountNeverExpires `
            -Description "Temporary RDP account"

          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          Add-LocalGroupMember `
            -Group $rdpGroup `
            -Member $username

          if (!(Get-LocalUser -Name $username)) {
            throw "Account creation failed"
          }

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Random account created successfully"

      # 4. CONFIGURE REMOTE DESKTOP
      - name: Configure Remote Desktop
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $base = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $rdp = "$base\WinStations\RDP-Tcp"

          Set-ItemProperty `
            -Path $base `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path $rdp `
            -Name "UserAuthentication" `
            -Value 1

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Get-NetFirewallRule `
            -DisplayName "RDP Tailscale Private" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Private" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "Remote Desktop configured"

      # 5. CONNECT TAILSCALE
      - name: Connect Tailscale
        shell: pwsh
        timeout-minutes: 5
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TS_AUTHKEY GitHub secret"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=android-rdp-${{ github.run_id }}" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 3

            $result = & $ts ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $result) {
              $candidate = ($result | Select-Object -First 1).Trim()

              if ($candidate -match '^100\.') {
                $ip = $candidate
                break
              }
            }
          }

          if (!$ip) {
            throw "Tailscale IP not assigned"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected successfully"

      # 6. VERIFY RDP
      - name: Verify RDP
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 4
          }

          if (!$ready) {
            throw "RDP port 3389 is not listening"
          }

          Write-Host "RDP listener verified"

      # 7. PUBLISH ALL CONNECTION INFORMATION
      - name: Publish Android connection details
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD
          $ip = $env:TAILSCALE_IP

          if (!$username -or !$password -or !$ip) {
            throw "Missing connection information"
          }

          $summary = @"
          # WINDOWS RDP - ANDROID CONNECTION

          ## STATUS: READY

          ### IP ADDRESS
          $ip

          ### USERNAME
          $username

          ### PASSWORD
          $password

          ### PORT
          3389

          ### CONNECTION
          Tailscale + Windows Remote Desktop

          ### RUN ID
          $env:GITHUB_RUN_ID

          "@

          $summary | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8

          Write-Host "Connection information published"

      # 8. MAINTAIN SESSION
      - name: Maintain RDP session
        shell: pwsh
        timeout-minutes: 330
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "RDP SESSION ACTIVE"

          while ($true) {

            $tsService = Get-Service Tailscale
            $rdpService = Get-Service TermService

            if ($tsService.Status -ne "Running") {
              Write-Warning "Restarting Tailscale"
              Start-Service Tailscale
            }

            if ($rdpService.Status -ne "Running") {
              Write-Warning "Restarting Remote Desktop"
              Start-Service TermService
            }

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            $ip = & $ts ip -4 2>$null

            if (!$listener -or !$ip) {
              Write-Warning "Connection health check failed"
            }
            else {
              Write-Host "[$(Get-Date)] RDP ONLINE - $ip"
            }

            Start-Sleep -Seconds 60
          }
